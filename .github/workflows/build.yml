name: Build Zygisk Service Spoofer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build DEX Header
        run: |
          javac -source 8 -target 8 -cp $ANDROID_SDK_ROOT/platforms/android-34/android.jar java_src/com/android/internal/util/ServiceHook.java
          $ANDROID_SDK_ROOT/build-tools/34.0.0/d8 java_src/com/android/internal/util/*.class --output .
          xxd -i classes.dex > jni/dex_bytes.h

      - name: Build arm64-v8a Binary
        run: |
          mkdir -p build_arm64 && cd build_arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          cd ..
          mkdir -p module/zygisk
          cp build_arm64/libservice_spoofer.so module/zygisk/arm64-v8a.so

      - name: Build armeabi-v7a Binary
        run: |
          mkdir -p build_arm32 && cd build_arm32
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          cd ..
          cp build_arm32/libservice_spoofer.so module/zygisk/armeabi-v7a.so

      - name: Prepare Module Directory
        run: |
          chmod 0755 module/META-INF/com/google/android/update-binary

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk_service_spoofer
          path: module/
          if-no-files-found: error
          compression-level: 0
